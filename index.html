<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora BCV / USDT — J&V Importaciones</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #171717;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.15);
      --text: #f5f5f5;
      --muted: #9ca3af;
      --danger: #f87171;
      --ok: #34d399;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      display: flex; justify-content: center;
    }
    .app { width: 100%; max-width: 480px; }
    header {
      text-align: center; padding: 14px; border: 1px solid var(--gold);
      border-radius: 14px; background: var(--card); margin-bottom: 14px;
    }
    header h1 { margin: 0; font-size: 1.15rem; color: var(--gold); letter-spacing: 0.5px; }
    .status { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
    .card {
      background: var(--card); border: 1px solid #2a2a2a; border-radius: 14px;
      padding: 16px; margin-bottom: 14px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #333;
      background: #0f0f0f; color: var(--text); font-size: 1rem; font-weight: 600;
    }
    input:focus { outline: none; border-color: var(--gold); }
    .btns { display: flex; gap: 6px; margin-top: 6px; }
    .btn-chip {
      flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid #333;
      background: #111; color: var(--text); font-size: 0.75rem; cursor: pointer;
    }
    .btn-chip.active { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); font-weight: 700; }
    .btn-refresh {
      width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px;
      border: 1px solid var(--gold); background: var(--gold-soft); color: var(--gold);
      font-weight: 700; cursor: pointer;
    }
    .kpi-main {
      background: linear-gradient(135deg, #1d1a10, #141414);
      border: 1px solid var(--gold); border-radius: 14px; padding: 16px;
      text-align: center; margin-bottom: 12px;
    }
    .kpi-main .lbl { font-size: 0.8rem; color: var(--gold); text-transform: uppercase; }
    .kpi-main .val { font-size: 2rem; font-weight: 800; margin: 4px 0; color: #fff; }
    .kpi-main .sub { font-size: 0.95rem; color: var(--ok); font-weight: 600; }
    .row {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px solid #242424; font-size: 0.9rem;
    }
    .row:last-child { border-bottom: none; }
    .alert {
      background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: #fecaca;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>J&V IMPORTACIONES • CALCULADORA BCV</h1>
      <div class="status" id="estadoApi">Cargando tasas del día...</div>
    </header>

    <div class="card">
      <div class="grid-2">
        <div>
          <label>Tasa BCV (Bs/$)</label>
          <input type="number" id="tasaBcv" step="0.01" value="919.82" oninput="calcular()" />
        </div>
        <div>
          <label>Tasa USDT P2P (Bs)</label>
          <input type="number" id="tasaUsdt" step="0.50" value="1109.94" oninput="calcular()" />
        </div>
      </div>
      <button class="btn-refresh" onclick="actualizarTasas()">↻ Actualizar tasas desde internet</button>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label>Costo en Maturín (USDT)</label>
          <input type="number" id="costoUsdt" step="0.10" value="10.00" oninput="calcular()" />
        </div>
        <div>
          <label>Ganancia deseada (%)</label>
          <input type="number" id="margenPct" step="1" value="30" oninput="calcular()" />
        </div>
      </div>

      <div style="margin-top: 12px;">
        <label>Comisión bancaria al cobrar</label>
        <div class="btns">
          <button class="btn-chip active" onclick="setComision(0, this)">0% Efectivo</button>
          <button class="btn-chip" onclick="setComision(0.30, this)">0,30% Pago Móvil</button>
          <button class="btn-chip" onclick="setComision(1.50, this)">1,50% Punto Venta</button>
        </div>
        <input type="hidden" id="comisionPct" value="0" />
      </div>
    </div>

    <div class="kpi-main">
      <div class="lbl">Precio a marcar en USD BCV</div>
      <div class="val" id="resUsdBcv">$15.69 BCV</div>
      <div class="sub" id="resBs">Cobrar: 14.429,22 Bs</div>
    </div>

    <div class="card">
      <div class="row"><span>Factor de brecha cambiaria:</span><strong id="resFactor">1,2067 (+20,7%)</strong></div>
      <div class="row"><span>Costo real en Bs:</span><strong id="resCostoBs">11.099,40 Bs</strong></div>
      <div class="row"><span>Ganancia neta limpia:</span><strong style="color:var(--ok)" id="resGanancia">$3,00 USDT</strong></div>
      <div class="row"><span>Comisión bancaria incluida:</span><strong id="resComisionBs">0,00 Bs</strong></div>
    </div>

    <div class="alert" id="alertaPerdida"></div>
  </div>

  <script>
    const fmtBs = (n) => n.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Bs';
    const fmtUsd = (n) => '$' + n.toFixed(2);

    function setComision(valor, btn) {
      document.getElementById('comisionPct').value = valor;
      document.querySelectorAll('.btn-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calcular();
    }

    function calcular() {
      const bcv = parseFloat(document.getElementById('tasaBcv').value) || 0;
      const usdt = parseFloat(document.getElementById('tasaUsdt').value) || 0;
      const costo = parseFloat(document.getElementById('costoUsdt').value) || 0;
      const margen = parseFloat(document.getElementById('margenPct').value) || 0;
      const comision = parseFloat(document.getElementById('comisionPct').value) || 0;

      if (bcv <= 0 || usdt <= 0) return;

      const factor = usdt / bcv;
      const brechaPct = (factor - 1) * 100;
      const objetivoUsdt = costo * (1 + margen / 100);
      const finalBs = (objetivoUsdt * usdt) / (1 - comision / 100);
      const etiquetaBcv = finalBs / bcv;
      const costoBs = costo * usdt;
      const comisionBs = finalBs * (comision / 100);
      const gananciaUsdt = (finalBs - costoBs - comisionBs) / usdt;

      // Simulación si se cobrara sin ajustar la brecha
      const sinAjusteBs = (objetivoUsdt * bcv) * (1 - comision / 100);
      const recompraSinAjuste = sinAjusteBs / usdt;
      const resultadoSinAjuste = recompraSinAjuste - costo;

      document.getElementById('resUsdBcv').textContent = fmtUsd(etiquetaBcv) + ' BCV';
      document.getElementById('resBs').textContent = 'Cobrar: ' + fmtBs(finalBs);
      document.getElementById('resFactor').textContent = `${factor.toFixed(4)} (+${brechaPct.toFixed(1)}%)`;
      document.getElementById('resCostoBs').textContent = fmtBs(costoBs);
      document.getElementById('resGanancia').textContent = `${fmtUsd(gananciaUsdt)} USDT (${fmtBs(gananciaUsdt * usdt)})`;
      document.getElementById('resComisionBs').textContent = fmtBs(comisionBs);

      document.getElementById('alertaPerdida').innerHTML =
        `⚠️ Si marcas este producto en <strong>${fmtUsd(objetivoUsdt)} BCV</strong> sin ajustar la brecha, al cambiar los bolívares solo recomprarás <strong>${recompraSinAjuste.toFixed(2)} USDT</strong> (${resultadoSinAjuste >= 0 ? 'ganancia real de ' + fmtUsd(resultadoSinAjuste) : 'pérdida de ' + fmtUsd(Math.abs(resultadoSinAjuste))}).`;

      localStorage.setItem('jv_tasas', JSON.stringify({ bcv, usdt, fecha: new Date().toLocaleString('es-VE') }));
    }

    async function actualizarTasas() {
      const estado = document.getElementById('estadoApi');
      estado.textContent = 'Consultando tasas en internet...';
      try {
        // Endpoint público de tasas en Venezuela (DolarApi)
        const resp = await fetch('https://ve.dolarapi.com/v1/dolares');
        if (!resp.ok) throw new Error('Sin respuesta');
        const data = await resp.json();

        const oficial = data.find(d => d.fuente === 'oficial');
        const paralelo = data.find(d => d.fuente === 'paralelo');

        if (oficial && oficial.promedio > 0) document.getElementById('tasaBcv').value = oficial.promedio.toFixed(2);
        if (paralelo && paralelo.promedio > 0) document.getElementById('tasaUsdt').value = paralelo.promedio.toFixed(2);

        const ahora = new Date().toLocaleString('es-VE');
        estado.textContent = `Actualizado: ${ahora}`;
        calcular();
      } catch (e) {
        const guardado = JSON.parse(localStorage.getItem('jv_tasas') || 'null');
        if (guardado) {
          document.getElementById('tasaBcv').value = guardado.bcv;
          document.getElementById('tasaUsdt').value = guardado.usdt;
          estado.textContent = `Modo sin conexión • Último respaldo: ${guardado.fecha}`;
        } else {
          estado.textContent = 'No se pudo conectar. Ingresa las tasas manualmente.';
        }
        calcular();
      }
    }

    actualizarTasas();
  </script>
</body>
</html>
